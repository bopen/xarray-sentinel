# Benchmark configuration, run with:
#
# python benchmarks/run.py benchmarks/config.toml
#
# Relative paths are relative to this file.

# environment of the tools, holding the CDSE S3 credentials, see .env.in, the GDAL
# options are passed to xarray-sentinel only, eopf runs with the GDAL defaults
env_file = "../.env"
# operations to run on every product, see OPERATIONS in run.py:
# convert         remote SAFE to local Zarr, both tools
# convert-staged  download the SAFE first, then convert to local Zarr, eopf only
operations = ["convert", "convert-staged"]
# SAFE products, paths or URLs, comment out the ones to skip
products = [
  # EW GRDM over the Faroe Islands, ~0.3 GB
  "s3://eodata/Sentinel-1/SAR/EW_GRDM_1S/2026/10/20/S1C_EW_GRDM_1SDH_20261020T070839_20261020T070915_009965_013DEA_057B.SAFE",
  # IW GRDH over Rome, ~1.8 GB
  "s3://eodata/Sentinel-1/SAR/IW_GRDH_1S/2026/10/22/S1C_IW_GRDH_1SDV_20261022T051912_20261022T051937_009993_013EED_B8E3.SAFE",
  # IW GRDH over Rome as COG, same data as the GRDH, ~1.1 GB
  "s3://eodata/Sentinel-1/SAR/IW_GRDH_1S-COG/2026/10/22/S1C_IW_GRDH_1SDV_20261022T051912_20261022T051937_009993_013EED_050F_COG.SAFE",
  # IW SLC over Rome, same area as the GRDH, ~8.7 GB
  "s3://eodata/Sentinel-1/SAR/IW_SLC__1S/2026/10/22/S1C_IW_SLC__1SDV_20261022T051910_20261022T051938_009993_013EED_456A.SAFE"
]
# number of times each operation is run on each product
repeat = 1
# the outputs are written to <target>/<operation>/<tool>/<product>.zarr
target = "output"
# tools to run, an operation skips the tools that do not support it
tools = ["xarray-sentinel", "eopf"]

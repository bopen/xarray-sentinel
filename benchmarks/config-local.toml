# Benchmark configuration of the local SAFE products, run with:
#
# python benchmarks/run.py benchmarks/config-local.toml --label <hostname>-local
#
# The products of config.toml, download them to benchmarks/data with:
#
# python benchmarks/download.py benchmarks/config.toml
#
# Relative paths are relative to this file.

# same environment as config.toml, see .env.in
env_file = "../.env"
# operations to run on every product, see OPERATIONS in run.py:
# convert         local SAFE to local Zarr, both tools
operations = ["convert"]
# SAFE products, paths or URLs, comment out the ones to skip
products = [
  # EW GRDM north of Svalbard, ~0.5 GB
  "data/S1C_EW_GRDM_1SDH_20261020T070234_20261020T070339_009965_013DEA_83FA.SAFE",
  # EW GRDM north of Svalbard as COG, same data as the GRDM, ~0.3 GB
  "data/S1C_EW_GRDM_1SDH_20261020T070234_20261020T070339_009965_013DEA_E0DE_COG.SAFE",
  # EW SLC north of Svalbard, same acquisition as the GRDM, ~7.9 GB
  "data/S1C_EW_SLC__1SDH_20261020T070234_20261020T070340_009965_013DEA_0C2D.SAFE",
  # IW GRDH over Rome, ~1.8 GB
  "data/S1C_IW_GRDH_1SDV_20261029T051057_20261029T051122_010095_014269_71D7.SAFE",
  # IW GRDH over Rome as COG, same data as the GRDH, ~1.2 GB
  "data/S1C_IW_GRDH_1SDV_20261029T051057_20261029T051122_010095_014269_C21D_COG.SAFE",
  # IW SLC over Rome, same acquisition as the GRDH, ~8.7 GB
  "data/S1C_IW_SLC__1SDV_20261029T051055_20261029T051123_010095_014269_D7D7.SAFE",
  # SM S3 GRDH over the Marquesas Islands, ~0.4 GB
  "data/S1C_S3_GRDH_1SDV_20261031T150107_20261031T150128_010130_014383_B806.SAFE",
  # SM S3 GRDH over the Marquesas Islands as COG, same data as the GRDH, ~0.2 GB
  "data/S1C_S3_GRDH_1SDV_20261031T150107_20261031T150128_010130_014383_987F_COG.SAFE",
  # SM S3 SLC over the Marquesas Islands, same acquisition as the GRDH, ~6.0 GB
  "data/S1C_S3_SLC__1SDV_20261031T150107_20261031T150128_010130_014383_2924.SAFE"
]
# number of times each operation is run on each product
repeat = 1
# the outputs are written to <target>/<operation>/<tool>/<product>.zarr
target = "output/local"
# tools to run, an operation skips the tools that do not support it
tools = ["xarray-sentinel", "eopf"]
